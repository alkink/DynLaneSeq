[program:v33_private_head_firewall_gate]
directory=/workspace/DynLaneSeq
command=/bin/bash /workspace/DynLaneSeq/ops/run_v33_private_head_gate.sh
autostart=false
autorestart=false
startsecs=1
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspace/DynLaneSeq/outputs/diagnostics/v33_private_head_firewall_gate/supervisor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
