[program:v34_temporal_observability]
directory=/workspace/DynLaneSeq
command=/bin/bash /workspace/DynLaneSeq/ops/run_v34_temporal_observability_audit.sh
autostart=false
autorestart=false
startsecs=1
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/workspace/DynLaneSeq/outputs/diagnostics/v34_temporal_candidate_observability/supervisor.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
