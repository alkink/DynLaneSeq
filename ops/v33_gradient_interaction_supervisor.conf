[program:v33_gradient_interaction_audit]
environment=PROC_NAME="%(program_name)s"
command=/bin/bash /workspace/DynLaneSeq/ops/run_v33_gradient_interaction_audit.sh
directory=/workspace/DynLaneSeq
autostart=false
autorestart=unexpected
startsecs=1
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/DynLaneSeq/outputs/diagnostics/v33_primary_aux_sufficiency_gate/gradient_interaction/supervisor.log
redirect_stderr=true
stdout_logfile_maxbytes=0
