[program:v38_direct_primary_maturity]
command=/bin/bash /workspace/DynLaneSeq/ops/run_v38_direct_primary_maturity.sh
directory=/workspace/DynLaneSeq
autostart=false
autorestart=unexpected
startsecs=0
startretries=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/DynLaneSeq/outputs/diagnostics/v38_direct_primary_maturity/supervisor.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
redirect_stderr=true
environment=PYTHONUNBUFFERED="1",PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True"
