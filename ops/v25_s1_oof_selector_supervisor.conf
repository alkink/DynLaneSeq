[program:v25_s1_oof_selector]
command=/bin/bash /workspace/DynLaneSeq_v25/ops/run_v25_s1_oof_selector.sh
directory=/workspace/DynLaneSeq_v25
autostart=false
autorestart=unexpected
startretries=3
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/DynLaneSeq_v25/outputs/logs/v25_s1_oof_selector.stdout.log
stderr_logfile=/workspace/DynLaneSeq_v25/outputs/logs/v25_s1_oof_selector.stderr.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"
