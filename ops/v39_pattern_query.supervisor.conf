[program:v39_pattern_query]
directory=/workspace/DynLaneSeq
command=/bin/bash /workspace/DynLaneSeq/ops/run_v39_pattern_query_initialization.sh
environment=DYNLANESEQ_PROJECT="/workspace/DynLaneSeq",CULANE_ROOT="/workspace/CULane",DYNLANESEQ_PYTHON="/venv/clrernet/bin/python",PYTHONUNBUFFERED="1",PYTORCH_CUDA_ALLOC_CONF="expandable_segments:True"
autostart=true
autorestart=unexpected
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

