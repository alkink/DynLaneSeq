[program:v23_gate]
command=/workspace/DynLaneSeq_v23/ops/run_v23_gate.sh
directory=/workspace/DynLaneSeq_v23
autostart=true
autorestart=unexpected
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
environment=PROC_NAME="v23_gate"
