[program:v35_raw_rgb_temporal_observability]
command=/bin/bash /workspace/DynLaneSeq/ops/run_v35_raw_rgb_temporal_observability.sh
directory=/workspace/DynLaneSeq
autostart=false
autorestart=unexpected
startsecs=3
startretries=2
stopasgroup=true
killasgroup=true
