[program:v30_vs_v7_exact_50k]
directory=/workspace/DynLaneSeq
command=/usr/bin/bash scripts/run_culane_v30_vs_v7_exact_35k_to50k.sh
environment=PYTHON="/venv/clrernet/bin/python",DATA_ROOT="/workspace/CULane",DEVICE="cuda",NUM_WORKERS="12",METRIC_WORKERS="16",EVAL_BATCH_SIZE="16"
