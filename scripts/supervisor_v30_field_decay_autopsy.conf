[program:v30_field_decay_autopsy]
command=/bin/bash /workspace/DynLaneSeq/scripts/run_culane_v30_field_decay_autopsy.sh
directory=/workspace/DynLaneSeq
autostart=false
autorestart=unexpected
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/portal/v30_field_decay_autopsy.log
redirect_stderr=true
stdout_logfile_maxbytes=0
environment=PYTHON="/venv/clrernet/bin/python",DATA_ROOT="/workspace/CULane",DEVICE="cuda",NUM_WORKERS="12",EVAL_BATCH_SIZE="16",METRIC_WORKERS="16"
