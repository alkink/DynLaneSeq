_base_: culane_s0_structured_query_dla34_v7_joint_four_slot_resume_safe.yaml

output_dir: outputs/diagnostics/v10_global_visual_geometry_gate_225k/legacy_control

# Paired short-horizon control.  It continues the production V7 selector and
# bounded hard-reference refiner on exactly the same stream as V10 while the
# proposal detector/backbone remains frozen.
model:
  structured_query:
    intermediate_supervision: false

loss:
  w_exist: 0.0
  w_intermediate_exist: 0.0
  w_point: 0.0
  w_range: 0.0
  w_smooth: 0.0
  w_line_iou: 0.0
  w_row_dfl: 0.0
  w_seg: 0.0
  w_centerline: 0.0
  w_quality: 0.0
  w_cardinality: 0.0
  w_score_margin: 0.0
  w_set_selection: 0.0
  w_pointer_selection: 0.0
  w_dynamic_proposal_heatmap: 0.0
  w_dynamic_proposal_x: 0.0
  w_dynamic_proposal_range: 0.0
  lambda_coarse: 0.0
  lambda_geometry_draft: 0.0
  lambda_intermediate: 0.0
  lambda_training_auxiliary: 0.0
  w_four_slot_selection: 1.0
  w_four_slot_geometry: 1.0

optimizer:
  base_lr: 0.00001
  evidence_lr: 0.00001
  backbone_lr: 0.0
  weight_decay: 0.0001
  parameter_groups:
    - name: legacy_four_slot
      lr: 0.00001
      prefixes:
        - structured_query_head.set_selection_head.

scheduler:
  name: constant

training:
  seed: 3407
  batch_size: 4
  gradient_accumulation_steps: 4
  max_iters: 3000
  checkpoint_interval: 500
  checkpoint_model_prefixes:
    - structured_query_head.set_selection_head
  checkpoint_include_optimizer: true
  save_last_alias: false
  log_interval: 50
  amp: true
  amp_dtype: bfloat16
  channels_last: true
  compile_model: false
  frozen_detector_eval: true
  trainable_parameter_prefixes:
    - structured_query_head.set_selection_head
  trainable_module_prefixes:
    - structured_query_head.set_selection_head
  clip_grad_norm: 1.0
  clip_grad_norm_mode: global
  check_finite_grad: true
