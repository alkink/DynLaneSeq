_base_: culane_s0_structured_query_dla34_v7_joint_four_slot_resume_safe.yaml

output_dir: outputs/diagnostics/v28_refined_belief_gate

dataset:
  lists:
    train: list/train.txt
    val: list/val.txt

model:
  name: DynLaneSeqV28
  pretrained_backbone: false
  require_pretrained_backbone: false
  structured_query:
    row_reference:
      projection_backend: fused

v28:
  hidden_dim: 96
  query_dim: 96
  vertical_layers: 2
  num_heads: 4
  ff_dim: 256
  # This is a weak source-centred spatial coordinate prior, not the legacy
  # V7 route confidence. Both B and C receive the identical prior.
  source_prior_sigma_px: 64.0
  source_prior_weight: 0.25
  freeze_batch_norm_stats: true
  loss:
    route: 1.0
    # Ignored by arm B. Arm C is otherwise tensor/data/seed identical.
    field: 0.5
    target_temperature: 0.05
    target_delta: 0.05
    target_floor: 0.0
    line_width: 30.0
    minimum_valid_rows: 5
  optimizer:
    backbone_lr: 0.00002
    router_lr: 0.00010
    weight_decay: 0.0001
    warmup_steps: 400
    minimum_lr_ratio: 0.10

augmentation:
  cut_height: 270
  horizontal_flip_prob: 0.5
  color_jitter: true
  channel_shuffle_prob: 0.0
  hue_saturation_prob: 0.2
  blur_prob: 0.1
  affine_prob: 0.2
  affine_translate_x: 0.03
  affine_translate_y: 0.02
  affine_rotate_deg: 2.0
  affine_scale_min: 0.95
  affine_scale_max: 1.05
  random_shadow_prob: 0.2
  random_shadow_min_opacity: 0.20
  random_shadow_max_opacity: 0.55
  random_shadow_min_vertices: 3
  random_shadow_max_vertices: 6
  random_shadow_roi_start_y: 0.25

dataloader:
  num_workers: 4
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 4
  resume_safe: true
  eval_batch_size: 1

training:
  seed: 3407
  cpu_threads: 8
  # Physical batch is deliberately conservative for the frozen V7 forward,
  # 4x32 counterfactual refiner replay, and trainable belief DLA on 16 GiB.
  # The first server smoke profiles whether this can safely be increased.
  batch_size: 2
  gradient_accumulation_steps: 4
  max_iters: 6000
  amp: true
  amp_dtype: bfloat16
  channels_last: true
  clip_grad_norm: 1.0
  log_interval: 25

postprocess:
  # Cardinality/activity remain exact V7. No learned quality threshold and no
  # NMS are allowed in this first geometry-selection gate.
  score_mode: exist
  score_thresh: 0.5
  quality_score_power: 0.0
  lane_nms_distance_thresh_px: 0.0
  top_k: 4

