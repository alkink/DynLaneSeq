_base_: culane_s0_structured_query_dla34_v7_joint_four_slot_resume_safe.yaml

output_dir: outputs/diagnostics/v9_slot_owned_geometry_gate_225k/control

# V9 control and treatment share the exact same geometry-producing forward:
# four global soft proposal memories initialize four independent row states,
# which consume local P2 evidence and two layers of vertical interaction before
# predicting fresh x/range geometry.  This control detaches the global
# candidate/slot representation only on the geometry backward edge.
model:
  structured_query:
    intermediate_supervision: false
    set_selection:
      four_slot_refinement_enabled: false
      four_slot_slot_owned_geometry_enabled: true
      four_slot_geometry_detach_router_states: true
      four_slot_geometry_router_state_gradient_scale: 0.50
      four_slot_slot_owned_geometry_hidden_dim: 256
      four_slot_slot_owned_geometry_delta_offsets_px:
        [-160.0, -96.0, -48.0, -24.0, 0.0, 24.0, 48.0, 96.0, 160.0]
      four_slot_slot_owned_geometry_evidence_offsets_px:
        [-48.0, -24.0, -12.0, 0.0, 12.0, 24.0, 48.0]
      four_slot_slot_owned_geometry_route_temperature: 1.0
      four_slot_slot_owned_geometry_route_gradient_scale: 0.25
      four_slot_slot_owned_geometry_structured_unique_routing: true
      four_slot_slot_owned_geometry_vertical_layers: 2
      four_slot_slot_owned_geometry_vertical_num_heads: 8
      four_slot_slot_owned_geometry_vertical_ff_dim: 512
      four_slot_slot_owned_geometry_vertical_dropout: 0.0
      four_slot_slot_owned_geometry_zero_init_delta_heads: false
      four_slot_slot_owned_geometry_delta_head_init_std: 0.001
      four_slot_range_refinement_enabled: true
      four_slot_range_delta_offsets_norm:
        [-0.20, -0.10, -0.05, 0.0, 0.05, 0.10, 0.20]

loss:
  w_exist: 0.0
  w_intermediate_exist: 0.0
  w_point: 0.0
  w_range: 0.0
  w_smooth: 0.0
  w_line_iou: 0.0
  w_row_dfl: 0.0
  w_seg: 0.0
  w_centerline: 0.0
  w_quality: 0.0
  w_cardinality: 0.0
  w_score_margin: 0.0
  w_set_selection: 0.0
  w_pointer_selection: 0.0
  w_dynamic_proposal_heatmap: 0.0
  w_dynamic_proposal_x: 0.0
  w_dynamic_proposal_range: 0.0
  lambda_coarse: 0.0
  lambda_geometry_draft: 0.0
  lambda_intermediate: 0.0
  lambda_training_auxiliary: 0.0
  w_four_slot_selection: 1.0
  w_four_slot_geometry: 1.0

optimizer:
  base_lr: 0.00001
  evidence_lr: 0.00001
  backbone_lr: 0.0
  weight_decay: 0.0001
  parameter_groups:
    - name: global_slot_router
      lr: 0.00001
      prefixes:
        - structured_query_head.set_selection_head.input_norm.
        - structured_query_head.set_selection_head.input_projection.
        - structured_query_head.set_selection_head.proposal_encoder.
        - structured_query_head.set_selection_head.slot_decoder.
        - structured_query_head.set_selection_head.slot_tokens.
        - structured_query_head.set_selection_head.slot_norm.
        - structured_query_head.set_selection_head.candidate_norm.
        - structured_query_head.set_selection_head.slot_query.
        - structured_query_head.set_selection_head.candidate_key.
        - structured_query_head.set_selection_head.active.
    - name: fresh_slot_geometry
      lr: 0.00010
      prefixes:
        - structured_query_head.set_selection_head.slot_owned_geometry.

scheduler:
  name: constant

training:
  seed: 3407
  batch_size: 4
  gradient_accumulation_steps: 4
  max_iters: 2000
  checkpoint_interval: 500
  checkpoint_model_prefixes:
    - structured_query_head.set_selection_head
  checkpoint_include_optimizer: true
  save_last_alias: false
  log_interval: 50
  amp: true
  amp_dtype: bfloat16
  channels_last: true
  compile_model: false
  frozen_detector_eval: true
  trainable_parameter_prefixes:
    - structured_query_head.set_selection_head
  trainable_module_prefixes:
    - structured_query_head.set_selection_head
  clip_grad_norm: 1.0
  clip_grad_norm_mode: global
  check_finite_grad: true
