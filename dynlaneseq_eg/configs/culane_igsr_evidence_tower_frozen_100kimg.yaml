_base_: debug/culane_igsr_gate_evidence_tower_2k.yaml

output_dir: outputs/culane_igsr_evidence_tower_frozen_100kimg

dataset:
  lists:
    train: list/train_gt.txt
    val: list/test_2k.txt
    test: list/test.txt

dataloader:
  num_workers: 12
  pin_memory: true
  shuffle: true
  eval_batch_size: 1
  persistent_workers: true
  prefetch_factor: 4

training:
  seed: 3407
  batch_size: 4
  gradient_accumulation_steps: 4
  max_iters: 6250
  checkpoint_interval: 6250
  log_interval: 50
  vis_interval: 1000

