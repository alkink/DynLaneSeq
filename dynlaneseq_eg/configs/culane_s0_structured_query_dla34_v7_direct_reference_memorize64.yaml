_base_: culane_s0_structured_query_dla34_v7_direct_reference_gate_25k_to28k.yaml

output_dir: outputs/diagnostics/unified_lane_set_v7_reference_gate/memorize64_direct

model:
  structured_query:
    set_selection:
      dropout: 0.0

dataset:
  augmentation:
    horizontal_flip_prob: 0.0
    color_jitter: false
    channel_shuffle_prob: 0.0
    hue_saturation_prob: 0.0
    blur_prob: 0.0
    affine_prob: 0.0
    affine_translate_x: 0.0
    affine_translate_y: 0.0
    affine_rotate_deg: 0.0
    affine_scale_min: 1.0
    affine_scale_max: 1.0
    random_shadow_prob: 0.0

optimizer:
  base_lr: 0.0003
  evidence_lr: 0.0003
  parameter_groups:
    - name: final_lane_slots
      lr: 0.0003
      prefixes:
        - structured_query_head.set_selection_head.

training:
  batch_size: 4
  gradient_accumulation_steps: 1
  max_iters: 2000
  checkpoint_interval: 500
