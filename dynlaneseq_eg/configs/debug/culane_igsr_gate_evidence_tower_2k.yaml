_base_: culane_igsr_gate_pixel_only_2k.yaml

output_dir: outputs/debug_igsr_gate_evidence_tower_2k

model:
  active_corridor:
    scorer_type: lane_evidence_tower
    offsets_px: [-32, -24, -16, -8, 0, 8, 16, 24, 32]
    evidence_dim: 64
    tower_blocks: 2
    profile_dim: 64
    profile_blocks: 2
    row_kernel_size: 5
    profile_kernel_size: 3
    train_center_jitter_px: 0.0
    train_center_jitter_knots: 5
    train_center_jitter_prob: 0.0
    gate_enabled: false
    gate_hidden_dim: 64
    gate_bias: -1.0
    freeze_non_active_modules: true
    skip_row_decoder: true
    center_init_bias: 0.0
    dropout: 0.05
    zero_init: true
    authoritative_geometry: true

loss:
  w_seg: 1.0
  w_centerline: 0.5
  seg_pos_weight: 4.0
  centerline_sigma_bins: 1.5
  centerline_pos_weight: 2.0
  w_active_offset_reg: 2.0
  w_active_offset_ce: 0.1
  w_active_offset_tangent: 0.15
  w_active_gate: 0.0
  active_gate_error_threshold_px: 4.0
  active_gate_pos_weight: 1.25
  active_offset_max: 32.0
  active_offset_reg_beta_px: 2.0
  active_offset_reg_normalizer_px: 8.0
  active_offset_soft_target_sigma_px: 6.0
  active_offset_non_center_weight: 1.0
  active_offset_magnitude_weight: 0.5

optimizer:
  evidence_lr: 0.0001

training:
  seed: 3407
  batch_size: 4
  gradient_accumulation_steps: 4
  max_iters: 3000
  checkpoint_interval: 3000
