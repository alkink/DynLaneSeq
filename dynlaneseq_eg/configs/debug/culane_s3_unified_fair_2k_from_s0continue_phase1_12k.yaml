_base_: culane_s3_active_corridor_qualitycal_structured_query_2k_from_s2.yaml

output_dir: outputs/debug_s3_unified_fair_2k_from_s0continue_phase1_12k

model:
  freeze_s0_frontend: false
  detach_coarse_x: false
  active_corridor:
    detach_center: false
    detach_refined_x_for_decoder: false
  quality_calibrator:
    detach_base: false
    detach_row_hidden: false
    quality_base: none

loss:
  lambda_coarse: 0.5
  w_active_offset_reg: 3.0
  w_active_offset_ce: 0.25

optimizer:
  base_lr: 0.00002
  row_decoder_lr: 0.00005
  evidence_lr: 0.00008
  backbone_lr: 0.000001
  weight_decay: 0.0001
  betas: [0.9, 0.999]

training:
  batch_size: 4
  max_iters: 12000
  checkpoint_interval: 3000
