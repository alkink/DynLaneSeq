output_dir: outputs/culane_s0_igar_geometry_only_headonly_25k

dataset:
  name: CULane
  root: dataset
  lists:
    train: list/train_gt.txt
    val: list/val.txt
    test: list/test.txt
  min_valid_rows: 5
  cut_height: 270
  infer_seg_labels: true

augmentation:
  cut_height: 270
  horizontal_flip_prob: 0.5
  color_jitter: true
  channel_shuffle_prob: 0.1
  hue_saturation_prob: 0.7
  blur_prob: 0.2
  affine_prob: 0.7
  affine_translate_x: 0.1
  affine_translate_y: 0.1
  affine_rotate_deg: 3.0
  affine_scale_min: 0.8
  affine_scale_max: 1.2

dataloader:
  num_workers: 12
  pin_memory: true
  shuffle: true
  eval_batch_size: 1
  persistent_workers: true
  prefetch_factor: 4

model:
  name: DynLaneSeqS0
  input_h: 288
  input_w: 800
  fpn_channels: 128
  dim: 256
  pretrained_backbone: true
  freeze_backbone_bn: true
  freeze_all_bn: true
  num_slots: 64
  num_rows: 72
  x_bins: 200
  token_ignore_index: -100
  decoder_layers: 0
  row_decoder_layers: 2
  num_heads: 8
  decoder_ff_dim: 1024
  row_decoder_ff_dim: 512
  dropout: 0.1
  query_content_init: learned
  memory_value_with_pos: false
  structured_query:
    enabled: true
    num_instances: 64
    num_groups: 4
    num_layers: 2
    num_heads: 8
    ff_dim: 1024
    dropout: 0.1
    use_x_pos: true
    exist_prior_prob: 0.01
  seg_aux:
    enabled: true
    dropout: 0.1
  centerline_aux:
    enabled: true
    dropout: 0.1
  igar:
    enabled: true
    freeze_base: true
    hidden_dim: 128
    dropout: 0.0
    offsets_px: [-32.0, -16.0, -8.0, 0.0, 8.0, 16.0, 32.0]
    max_shift_px: 32.0
    max_tilt_px: 32.0
    local_reduce: mean_max
    row_pooling: mean_max
    detach_sample_x: true
    detach_base_x: true
    y_norm_mode: centered
    use_query: false

matcher:
  assignment: grouped_one_to_many
  num_groups: 4
  lambda_obj: 2.0
  lambda_point: 5.0
  lambda_range: 1.0
  lambda_line_iou: 1.0
  line_iou_radius: 7.5

loss:
  exist_loss_type: focal
  focal_alpha: 0.25
  focal_gamma: 2.0
  w_exist: 0.0
  w_point: 5.0
  w_range: 0.0
  w_smooth: 0.05
  w_line_iou: 2.0
  w_seg: 0.0
  w_centerline: 0.0
  w_quality: 0.0
  centerline_sigma_bins: 1.5
  centerline_pos_weight: 2.0
  line_iou_radius: 7.5
  seg_pos_weight: 4.0
  smooth_l1_beta: 0.01
  no_lane_weight: 1.0
  smoothness_contiguous: true
  lambda_coarse: 0.0

optimizer:
  base_lr: 0.00005
  structured_lr: 0.00005
  evidence_lr: 0.001
  backbone_lr: 0.00001
  weight_decay: 0.0001
  betas: [0.9, 0.999]

scheduler:
  name: cosine
  total_iters: 25000
  warmup_iters: 500
  min_lr_ratio: 0.05

postprocess:
  lane_nms_distance_thresh_px: 20.0
  lane_nms_min_overlap_points: 5
  top_k: 4

training:
  batch_size: 16
  max_iters: 25000
  amp: true
  tf32: true
  cudnn_benchmark: true
  clip_grad_norm: 1.0
  log_interval: 50
  vis_interval: 1000
  checkpoint_interval: 2500
