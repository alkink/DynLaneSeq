# From-scratch causal arm for the query-ownership hypothesis.  Relative to
# the matched row-reference control, the only optimization intervention is
# the lane-confidence weight used by Hungarian assignment.  Geometry costs,
# losses, architecture, seed, optimizer, and the full 278k cosine schedule
# are inherited unchanged.
matcher:
  lambda_obj: 0.5

# Intermediate saves are diagnostic bookkeeping only.  The matched causal
# comparison is made at 25k, where the historical control checkpoint exists.
training:
  checkpoint_interval: 5000
