_base_: culane_s0_structured_query_dla34_v5_a_protected_ownership_sidecar_25k.yaml

output_dir: outputs/diagnostics/unified_lane_set_v5_1_shared_trunk_gate/trunk

# One geometry-only-assignment ownership trajectory is shared by both causal
# forks.  Optimizer, scheduler and RNG state are intentionally retained at
# 10k; the fork experiment is invalid without this exact state.
training:
  max_iters: 10000
  checkpoint_interval: 10000
  checkpoint_include_optimizer: true
  save_last_alias: false
