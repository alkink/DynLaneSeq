_base_: culane_s0_structured_query_dla34_slots32_b8x2_1600x640_bins800_fpn256_l4_dfl_50ep.yaml

output_dir: outputs/culane_s0_structured_query_dla34_slots32_b8x2_1600x640_bins800_balanced_detail_fpn256_l4_dfl_50ep

model:
  # Preserve a direct normalized C2 detail path and fuse the top-down context
  # with learned positive weights.  All decoder and supervision settings remain
  # identical to the original DLA-34 control.
  neck:
    type: balanced_detail_fpn
    num_groups: 8
    upsample_mode: bilinear
    detail_init: 2.0
    context_init: 0.0
