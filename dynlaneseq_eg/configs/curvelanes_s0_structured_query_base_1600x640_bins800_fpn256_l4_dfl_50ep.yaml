# CurveLanes public protocol
# Raw source crops follow the CondLaneNet policy and are then resized to
# 1600x640 (the exact 2x counterpart of the common 800x320 setup).
output_dir: outputs/curvelanes_s0_structured_query_res34_slots32_b8x2_1600x640_bins800_fpn256_l4_dfl_50ep

dataset:
  name: CurveLanes
  root: /mnt/d/Datasets/CurveLanes/Curvelanes
  strict_image_shapes: true
  rasterize_segmentation: true
  seg_line_width: 16
  min_valid_rows: 5
  splits:
    train:
      list: train/train.txt
      image_root: train
      labels: true
    val:
      list: valid/valid.txt
      image_root: valid
      labels: true
    test:
      image_root: test
      labels: false

augmentation:
  horizontal_flip_prob: 0.5
  color_jitter: true
  channel_shuffle_prob: 0.1
  hue_saturation_prob: 0.7
  blur_prob: 0.2
  affine_prob: 0.7
  affine_translate_x: 0.1
  affine_translate_y: 0.1
  affine_rotate_deg: 10.0
  affine_scale_min: 0.8
  affine_scale_max: 1.2

dataloader:
  num_workers: 12
  pin_memory: true
  shuffle: true
  eval_batch_size: 8
  persistent_workers: true
  prefetch_factor: 4

model:
  name: DynLaneSeqS0
  input_h: 640
  input_w: 1600
  fpn_channels: 256
  dim: 256
  backbone_name: resnet
  resnet_depth: 34
  pretrained_backbone: true
  require_pretrained_backbone: true
  freeze_backbone_bn: true
  num_slots: 32
  num_rows: 160
  x_bins: 800
  token_ignore_index: -100
  decoder_layers: 0
  row_decoder_layers: 2
  num_heads: 8
  decoder_ff_dim: 1024
  row_decoder_ff_dim: 512
  dropout: 0.1
  query_content_init: learned
  memory_value_with_pos: false
  structured_query:
    enabled: true
    num_instances: 32
    num_groups: 4
    num_layers: 4
    num_heads: 8
    ff_dim: 1024
    dropout: 0.1
    use_x_pos: true
    evidence_x_bins: 400
    exist_prior_prob: 0.01
  seg_aux:
    enabled: true
    dropout: 0.1
  centerline_aux:
    enabled: true
    dropout: 0.1

matcher:
  assignment: grouped_one_to_many
  num_groups: 4
  lambda_obj: 2.0
  lambda_point: 5.0
  lambda_range: 1.0
  lambda_line_iou: 1.0
  line_iou_radius: 7.5

loss:
  exist_loss_type: focal
  focal_alpha: 0.25
  focal_gamma: 2.0
  w_exist: 2.0
  w_point: 5.0
  w_range: 1.0
  w_smooth: 0.05
  w_line_iou: 2.0
  w_seg: 1.0
  w_centerline: 0.25
  w_quality: 0.5
  w_row_dfl: 0.5
  row_dfl_warmup_iters: 5000
  centerline_sigma_bins: 1.5
  centerline_pos_weight: 2.0
  line_iou_radius: 7.5
  seg_pos_weight: 4.0
  smooth_l1_beta: 0.01
  no_lane_weight: 1.0
  smoothness_contiguous: true

optimizer:
  base_lr: 0.0001
  evidence_lr: 0.0002
  backbone_lr: 0.00001
  weight_decay: 0.0001
  betas: [0.9, 0.999]

# 100,000 train images / effective batch 16 = 6,250 optimizer steps/epoch.
# 312,500 steps is exactly 50 epochs.
scheduler:
  name: cosine
  total_iters: 312500
  warmup_iters: 1000
  min_lr_ratio: 0.01

postprocess:
  lane_nms_distance_thresh_px: 20.0
  lane_nms_min_overlap_points: 5
  top_k: 5
  quality_score_power: 0.5

training:
  seed: 3407
  batch_size: 8
  gradient_accumulation_steps: 2
  max_iters: 312500
  amp: true
  tf32: true
  cudnn_benchmark: true
  channels_last: true
  compile_model: false
  check_finite_grad: false
  clip_grad_norm: 1.0
  log_interval: 50
  vis_interval: 25000
  checkpoint_interval: 25000
