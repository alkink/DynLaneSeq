_base_: culane_s0_structured_query_dla34_unified_lane_set_v4_1_score_gate_base.yaml

output_dir: outputs/diagnostics/unified_lane_set_v4_1_score_gate/b_mlp_unique

model:
  structured_query:
    set_selection:
      candidate_interaction: independent

# Score-independent official-IoU ownership plus stronger negative calibration,
# but still no candidate-to-candidate communication.
loss:
  set_selection_share_matcher_assignment: false
  set_selection_positive_floor: 0.0
  set_selection_negative_weight: 2.0
  set_selection_rank_weight: 0.25
  set_selection_target_margin: 0.10
